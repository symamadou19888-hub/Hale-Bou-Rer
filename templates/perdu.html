<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enfant perdu - Halé Bou Rér</title>
</head>

<body>

<h1>Je cherche un enfant</h1>

<form method="POST" action="/perdu">

    <label>Photo de l'enfant</label><br>
    <input type="file" accept="image/*"><br><br>

    <label>Dernière zone connue</label><br>
    <input type="text" name="zone" placeholder="Exemple : Parcelles Assainies, Dakar"><br><br>

    <label>Description de l'enfant</label><br>
    <textarea name="description" placeholder="Âge, vêtements, signes particuliers..."></textarea><br><br>

    <label>Numéro de téléphone</label><br>
    <input type="tel" name="telephone" placeholder="Votre numéro"><br><br>

    <button type="submit">
        Publier la recherche
    </button>

</form>

<br>

<a href="/">⬅ Retour à l'accueil</a>

</body>
</html>
