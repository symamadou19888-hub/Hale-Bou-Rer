<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enfant perdu - Halé Bou Rér</title>
</head>

<body>

<h1>Je cherche un enfant</h1>

<form method="POST" action="/perdu" enctype="multipart/form-data">

    <label>Photo de l'enfant</label><br>
    <input type="file" name="photo" accept="image/*"><br><br>

    <label>Dernière zone connue</label><br>
    <input type="text" name="zone" placeholder="Exemple : Parcelles Assainies, Dakar"><br><br>

    <label>Description de l'enfant</label><br>
    <textarea name="description" placeholder="Âge, vêtements, signes particuliers..."></textarea><br><br>

    <label>Numéro de téléphone</label><br>
    <input type="tel" name="telephone" placeholder="Votre numéro"><br><br>

    <input type="hidden" name="latitude" id="latitude">
    <input type="hidden" name="longitude" id="longitude">

    <p id="statut_position">📍 Localisation en cours...</p>
    <br>

    <button type="submit">
        Publier la recherche
    </button>

    <script>
    window.onload = obtenirPosition;
    function obtenirPosition() {
        if (navigator.geolocation) {
            document.getElementById("statut_position").innerText = "Localisation en cours...";
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementById("latitude").value = position.coords.latitude;
                document.getElementById("longitude").value = position.coords.longitude;
                document.getElementById("statut_position").innerText = "✅ Position enregistrée";
            }, function() {
                document.getElementById("statut_position").innerText = "❌ Impossible d'obtenir la position";
            });
        } else {
            document.getElementById("statut_position").innerText = "❌ Géolocalisation non supportée";
        }
    }
    </script>

</form>

<br>

<a href="/">⬅ Retour à l'accueil</a>

</body>
</html>
