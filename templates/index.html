<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halé Bou Rér</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2E7D32">
</head>

<body>

<button onclick="window.location.href='/'" class="btn-retour">
←
</button>

<style>
.btn-retour {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 40px;
    height: 40px;
    border: 2px solid #2E7D32;
    border-radius: 50%;
    background: white;
    color: #2E7D32;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
</style>


<div class="header">
<img src="{{ url_for('static', filename='images/logo.png') }}" style="width:100%; max-width:500px; border-radius:20px;">
<h2 style="margin-bottom:5px;color:#228B22;"><span style="color:#FFD700;">👶</span> Retrouvons rapidement nos enfants</h2>
</div>

<div class="accueil">


{% if nb_aujourdhui and nb_aujourdhui > 0 %}
<a href="/signalements" style="text-decoration:none;">
<div style="background:#1976D2; color:white; padding:12px; border-radius:12px; max-width:400px; margin:15px auto; font-weight:bold; cursor:pointer;">
    🔔 {{ nb_aujourdhui }} nouveau{{ 's' if nb_aujourdhui > 1 else '' }} signalement{{ 's' if nb_aujourdhui > 1 else '' }} aujourd'hui
</div>
</a>
{% endif %}



<br>

<a href="/signalements">
    <button>
        📋 Voir les signalements
    </button>
</a>

<br><br>

<a href="/trouve">
    <button class="btn-trouve">
        🟢 J'ai trouvé un enfant
    </button>
</a>

<br><br>

<a href="/perdu">
    <button class="btn-perdu">
        🟠 Je cherche un enfant
    </button>
</a>

</div>

<button id="notifBtn">
    🔔 Activer les notifications
</button>

<script>
document.getElementById("notifBtn").onclick = async function() {
  try {
    if (!("Notification" in window)) {
        alert("Notification non supportee");
        return;
    }

    let permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("Notifications refusees");
        return;
    }

    let registration = await navigator.serviceWorker.ready;

    function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; i++) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    let vapidResponse = await fetch("/vapid-public-key");
    let vapidData = await vapidResponse.json();

    let subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapidData.publicKey)
    });

    let subJson = subscription.toJSON();

    await fetch("/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            endpoint: subJson.endpoint,
            p256dh: subJson.keys.p256dh,
            auth: subJson.keys.auth
        })
    });

    alert("Notifications activees");

  } catch (err) {
    alert("Erreur JS: " + err.message);
  }
};

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js');
}
</script>

</body>
</html>
