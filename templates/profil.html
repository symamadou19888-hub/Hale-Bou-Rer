<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - Halé Bou Rér</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:#F7F5F0; font-family:'Inter', sans-serif; margin:0;">

<button onclick="window.location.href='/'" class="btn-retour">
←
</button>

<style>
.btn-retour {
    position: fixed;
    top: -10px;
    left: -8px;
    width: auto;
    height: auto;
    border: none;
    border-radius: 0;
    background: transparent;
    color: #1B5E20;
    font-size: 76px;
    font-weight: 300;
    box-shadow: none;
    cursor: pointer;
    z-index: 999;
    line-height: 1;
}
.page-profil {
    max-width: 460px;
    margin: 0 auto;
    padding: 90px 20px 40px 20px;
}
.avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1B5E20, #E8A33D);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 700;
    margin: 0 auto 14px auto;
    box-shadow: 0 6px 18px rgba(27,94,32,0.25);
}
.nom-profil {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    color: #1A1A1A;
    text-align: center;
    margin: 0 0 4px 0;
}
.sous-titre {
    text-align: center;
    color: #6b6b6b;
    font-size: 14px;
    margin-bottom: 24px;
}
.carte-profil {
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.ligne-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #F0EEE8;
}
.ligne-info:last-child {
    border-bottom: none;
}
.ligne-info .icone {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #F7F5F0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
}
.ligne-info .texte {
    flex: 1;
    min-width: 0;
}
.ligne-info .texte .label {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.ligne-info .texte .valeur {
    font-size: 15px;
    color: #1A1A1A;
    font-weight: 500;
    word-break: break-word;
    overflow-wrap: break-word;
}
.badge-pub {
    display: inline-block;
    background: #E8A33D;
    color: white;
    font-weight: 600;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 2px;
}
.bouton-profil {
    display: block;
    text-align: center;
    padding: 15px;
    border-radius: 14px;
    text-decoration: none;
    margin-top: 14px;
    font-weight: 600;
    font-size: 15px;
}
.bouton-principal {
    background: #1B5E20;
    color: white;
}
.bouton-secondaire {
    background: white;
    color: #c0392b;
    border: 1.5px solid #f0d5d5;
}
</style>

<div class="page-profil">
    <div class="avatar">{{ (utilisateur.nom or "?")[0]|upper }}</div>
    <div class="nom-profil">{{ utilisateur.nom or "Utilisateur" }}</div>
    <div class="sous-titre">Membre Halé Bou Rér</div>

    <div class="carte-profil">
        <div class="ligne-info">
            <div class="icone">📧</div>
            <div class="texte">
                <div class="label">Email</div>
                <div class="valeur">{{ utilisateur.email or "Non renseigné" }}</div>
            </div>
        </div>
        <div class="ligne-info">
            <div class="icone">📱</div>
            <div class="texte">
                <div class="label">Téléphone</div>
                <div class="valeur">{{ utilisateur.telephone or "Non renseigné" }}</div>
            </div>
        </div>
        <div class="ligne-info">
            <div class="icone">📋</div>
            <div class="texte">
                <div class="label">Publications</div>
                <div class="badge-pub">{{ nb_publications }}</div>
            </div>
        </div>
    </div>

    <a href="/mes-publications" class="bouton-profil bouton-principal">Voir mes publications</a>
    <a href="/deconnexion" class="bouton-profil bouton-secondaire">Se déconnecter</a>
</div>

</body>
</html>
